name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact validated commit SHA from main to deploy"
        required: true
        type: string
      confirm:
        description: "Type 'deploy-production' to authorize production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production & Smoke Test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ejiib93jmwi0jbi4ui8598xn.ewr.prisma.build

    steps:
      - name: Verify explicit authorization
        if: inputs.confirm != 'deploy-production'
        run: |
          echo "Authorization confirmation must equal 'deploy-production'."
          exit 1

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact commit is on main
        id: sha
        run: |
          TARGET_SHA="${{ inputs.commit_sha }}"
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          git checkout --detach "$TARGET_SHA"
          SHORT_SHA="$(git rev-parse --short=7 "$TARGET_SHA")"
          echo "full=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Validate
        run: |
          pnpm run prisma:generate
          pnpm typecheck
          pnpm composer:check
          pnpm run build

      - name: Deploy to Prisma Cloud (production)
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          PRISMA_WORKSPACE_ID: ${{ secrets.PRISMA_WORKSPACE_ID }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
        run: |
          pnpm dlx --allow-build=esbuild @prisma/cli@8.0.0-rc.34 deploy \
            --config prisma.composer.config.ts \
            --name bjs-gas \
            --report /tmp/deploy-report.json

      - name: Resolve deployed URLs
        id: urls
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          PRISMA_WORKSPACE_ID: ${{ secrets.PRISMA_WORKSPACE_ID }}
        run: |
          DEPLOY_LIST=$(pnpm dlx --allow-build=esbuild @prisma/cli@8.0.0-rc.34 deploy list --config prisma.composer.config.ts --name bjs-gas --json)
          API_URL=$(echo "$DEPLOY_LIST" | jq -r '.envelope.result[] | select(.address == "bjs-gas.bjsgasapi" or .address == "bjsgasapi") | .url // empty')
          WEB_URL=$(echo "$DEPLOY_LIST" | jq -r '.envelope.result[] | select(.address == "bjs-gas.bjsgasweb" or .address == "bjsgasweb") | .url // empty')
          echo "api_url=${API_URL:-https://a3i9pecpa5hxogp2hpozah6d.ewr.prisma.build}" >> "$GITHUB_OUTPUT"
          echo "web_url=${WEB_URL:-https://ejiib93jmwi0jbi4ui8598xn.ewr.prisma.build}" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test & revision check
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
        run: |
          node scripts/smoke-test.mjs \
            --api-url "${{ steps.urls.outputs.api_url }}" \
            --web-url "${{ steps.urls.outputs.web_url }}" \
            --expected-revision "${{ steps.sha.outputs.short }}" \
            --refresh-if-stale
