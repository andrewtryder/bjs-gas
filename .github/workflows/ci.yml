name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: bjs_gas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # Temporary migration bootstrap: remove after committing the generated lockfile.
      - name: Generate migration lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload generated migration lockfile
        uses: actions/upload-artifact@v7
        with:
          name: composer-migration-lockfile
          path: pnpm-lock.yaml
          retention-days: 1

      - name: Capture lockfile for migration commit
        run: node -e 'const s = require("node:fs").readFileSync("pnpm-lock.yaml").toString("base64"); for (let i = 0; i < s.length; i += 4096) console.log("COMPOSER_LOCK_CHUNK " + i + " " + s.slice(i, i + 4096)); console.log("COMPOSER_LOCK_END " + s.length);'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit (High/Critical)
        run: pnpm audit --audit-level=high

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Lint
        run: pnpm --filter bjs-gas run lint

      - name: Format Check
        run: pnpm --filter bjs-gas run format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Composer configuration smoke check
        run: pnpm composer:check

      - name: Unit Tests
        run: pnpm test

      - name: Setup Test Database Schema
        run: pnpm prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/bjs_gas_test"

      - name: Integration Tests (Postgres)
        run: pnpm test:integration
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/bjs_gas_test"

      - name: Build API & Web
        run: pnpm run build
