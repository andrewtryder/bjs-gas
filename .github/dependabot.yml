version: 2
updates:
  # pnpm workspace dependencies (monitored at root to keep pnpm-lock.yaml consistent)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Pinned by Prisma Composer 0.39 / Alchemy 2.0.0-beta.85 runtime graph
      - dependency-name: "effect"
      - dependency-name: "@prisma/composer*"
      - dependency-name: "@prisma/orm-postgres"
      - dependency-name: "alchemy"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
