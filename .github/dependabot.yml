version: 2
updates:
  # pnpm workspace dependencies (monitored at root to keep pnpm-lock.yaml consistent)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Pinned by Prisma Composer 0.40 / Alchemy 2.0.0-beta.87 runtime graph
      - dependency-name: "effect"
      - dependency-name: "@prisma/composer*"
      - dependency-name: "@prisma/orm-postgres"
      - dependency-name: "alchemy"
      # Keep Prisma ORM on stable 7.x until Prisma 8 reaches GA
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/adapter-pg"
        update-types: ["version-update:semver-major"]
    groups:
      prisma-orm:
        patterns:
          - "prisma"
          - "@prisma/client"
          - "@prisma/adapter-pg"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "prisma"
          - "@prisma/client"
          - "@prisma/adapter-pg"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
