packages:
  - "."
  - "web"
  - "packages/*"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.6'
  - '@next/swc-darwin-arm64@16.4.6'
  - '@next/swc-darwin-x64@16.4.6'
  - '@next/swc-linux-arm64-gnu@16.4.6'
  - '@next/swc-linux-arm64-musl@16.4.6'
  - '@next/swc-linux-x64-gnu@16.4.6'
  - '@next/swc-linux-x64-musl@16.4.6'
  - '@next/swc-win32-arm64-msvc@16.4.6'
  - '@next/swc-win32-x64-msvc@16.4.6'
  - next@16.4.6
overrides:
  # Composer 0.18 + Alchemy need Effect 4 at the workspace root.
  # Prisma CLI 6 still needs Effect 3 on @prisma/config only.
  "@prisma/config>effect": "3.21.0"
  effect: 4.0.0-rc.112
  hono: ^4.13.7
  "@hono/node-server": ^1.19.15
  lodash: ^4.18.1
  valibot: ^1.4.2
  deepmerge-ts: ^8.0.2
  vitest: ^4.1.11
  "@effect/platform-node>undici": "8.12.4"
  "alchemy>undici": "7.30.2"
  vite: ^8.3.7
  next: ^16.4.6
  fast-uri: ^3.1.8
  source-map-js: ^1.2.2
  sharp: ^0.35.5
# braces@3.0.3 (via alchemy → micromatch) has no patched release for GHSA-vfj7-8cjw-p6xm.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
